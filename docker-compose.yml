services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: retrio-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retrio_db
    ports:
      - "5432:5432"
    volumes:
      - retrio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retrio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  retrio_pgdata:
    driver: local
